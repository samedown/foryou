<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seni Seviyorum ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  body{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,'Noto Sans',sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  #bg{position:fixed;inset:0;width:100%;height:100%;}
  #glow{position:fixed;left:50%;top:46%;width:10px;height:10px;transform:translate(-50%,-50%);border-radius:50%;
        background:radial-gradient(circle,rgba(255,20,50,.22),rgba(255,0,40,0) 70%);opacity:0;transition:opacity 3s ease, width 3s ease, height 3s ease;pointer-events:none;}
  #heart{position:fixed;inset:0;}
  .w{position:absolute;white-space:nowrap;color:#ff2f45;font-weight:700;
     text-shadow:0 0 6px rgba(255,30,60,.75),0 0 18px rgba(255,0,40,.35);
     opacity:0;transform:scale(.2);filter:blur(6px);
     transition:opacity .9s ease,transform 1s cubic-bezier(.2,1.5,.4,1),filter .9s ease;}
  .w.tr{color:#ff5a6c;}
  .w.on{opacity:1;transform:none;filter:none;}
  #heart.beat{animation:beat 1.7s ease-in-out infinite;}
  @keyframes beat{0%{transform:scale(1)}14%{transform:scale(1.045)}28%{transform:scale(1)}42%{transform:scale(1.035)}70%{transform:scale(1)}100%{transform:scale(1)}}
  #intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0 24px;text-align:center;
         font-family:'Dancing Script',cursive;font-size:clamp(26px,6vw,46px);color:#ff4d61;
         text-shadow:0 0 12px rgba(255,30,60,.6);opacity:0;transition:opacity 1.4s ease;pointer-events:none;}
  #intro.on{opacity:1;}
  #msg{position:fixed;left:0;right:0;bottom:calc(5vh + env(safe-area-inset-bottom,0px));text-align:center;
       font-family:'Dancing Script',cursive;font-size:clamp(30px,7vw,54px);color:#fff;
       text-shadow:0 0 10px rgba(255,40,70,.9),0 0 30px rgba(255,0,40,.6);
       opacity:0;transform:translateY(14px);transition:opacity 2s ease,transform 2s ease;pointer-events:none;}
  #msg.on{opacity:1;transform:none;}
  #replay{position:fixed;right:14px;top:14px;background:rgba(255,40,70,.08);border:1px solid rgba(255,60,90,.35);color:#ff7a8a;
          font:600 13px/1 inherit;font-family:inherit;padding:9px 14px;border-radius:999px;cursor:pointer;opacity:0;transition:opacity 1.5s ease;}
  #replay.on{opacity:.75;}
  #replay:hover{opacity:1;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="glow"></div>
<div id="heart"></div>
<div id="intro">Sana söylemek istediğim bir şey var…</div>
<div id="msg">Seni seviyorum ♥</div>
<button id="replay" type="button">↻ Tekrar</button>

<script>
(function(){
  const FONT = "'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,'Noto Sans',sans-serif";
  const PHRASES = [
    "Seni seviyorum","Seni seviyorum","Seni seviyorum","Seni seviyorum",
    "I love you","Je t'aime","Te amo","Ti amo","Ich liebe dich","Eu te amo",
    "Ik hou van jou","Jag älskar dig","Kocham cię","Я тебя люблю","Σ' αγαπώ",
    "愛してる","我爱你","사랑해","Aku cinta kamu","Anh yêu em","ฉันรักเธอ",
    "Я тебе кохаю","Te iubesc","Volim te","Seni sevirəm","أحبك","Mahal kita",
    "Te quiero","Rakastan sinua","Szeretlek","Miluji tě","Jeg elsker deg",
    "मैं तुमसे प्यार करता हूँ","Men seni sevaman","Ich hab dich lieb","Saya cinta padamu"
  ];
  const SIZES = [0.75,0.85,0.95,1.05,1.2,1.35];

  const heart = document.getElementById('heart');
  const glow = document.getElementById('glow');
  const intro = document.getElementById('intro');
  const msg = document.getElementById('msg');
  const replay = document.getElementById('replay');
  const mctx = document.createElement('canvas').getContext('2d');

  let timers = [];
  let built = false;
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  // classic parametric heart: deep cleft on top, sharp tip at the bottom
  const POLY = [];
  for (let i=0;i<360;i++){
    const t = i/360*Math.PI*2;
    POLY.push([16*Math.pow(Math.sin(t),3), 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)]);
  }
  function inside(x, y){
    let c = false;
    for (let i=0,j=POLY.length-1;i<POLY.length;j=i++){
      const [xi,yi]=POLY[i],[xj,yj]=POLY[j];
      if ((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) c=!c;
    }
    return c;
  }
  function measure(text, size){
    mctx.font = `700 ${size}px ${FONT}`;
    return mctx.measureText(text).width * 1.06;
  }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function layout(){
    const W = innerWidth, H = innerHeight;
    // heart spans x:[-16,16], y:[-17,12]
    const s = Math.min(W*0.96/32, H*0.72/29);
    const cx = W/2, cy = H*0.44 - 2.5*s;
    const u = Math.max(8.5, s*32/31);       // base font size
    const rowH = u*1.6;
    const top = cy - 12*s, bottom = cy + 17*s;
    const toN = (px,py) => [(px-cx)/s, -(py-cy)/s];
    const words = [];

    for (let y = top; y + rowH <= bottom + rowH*0.3; y += rowH){
      // find horizontal intervals where the whole row height is inside the heart
      const yt = y + rowH*0.18, yb = y + rowH*0.82;
      const intervals = [];
      let start = null;
      for (let x = cx - 16.5*s; x <= cx + 16.5*s; x += 1.5){
        const [ax,ay] = toN(x,yt), [bx,by] = toN(x,yb);
        const ok = inside(ax,ay) && inside(bx,by);
        if (ok && start === null) start = x;
        if (!ok && start !== null){ intervals.push([start, x]); start = null; }
      }
      if (start !== null) intervals.push([start, cx + 16.5*s]);

      for (const [x0raw, x1raw] of intervals){
        const pad = u*0.1;
        const x0 = x0raw + pad, x1 = x1raw - pad, w = x1 - x0;
        if (w < u*1.6) continue;
        const items = []; let used = 0, fails = 0, last = null;
        while (fails < 14){
          let text = pick(PHRASES); if (text === last) { fails++; continue; }
          let size = u * pick(SIZES);
          if (size > rowH*0.92) size = rowH*0.92;
          const ww = measure(text, size), gap = u*0.45;
          if (used + ww + (items.length ? gap : 0) <= w){
            used += ww + (items.length ? gap : 0);
            items.push({text,size,ww}); last = text; fails = 0;
          } else fails++;
        }
        if (!items.length) continue;
        const contentW = items.reduce((a,b)=>a+b.ww,0);
        const free = w - contentW;
        const g = items.length > 1 ? Math.min(free/(items.length-1), u*1.1) : 0;
        const total = contentW + g*(items.length-1);
        let x = x0 + (w - total)/2;
        for (const it of items){
          words.push({text:it.text,size:it.size,x,y,rowH});
          x += it.ww + g;
        }
      }
    }
    return {words, cx, cy, s};
  }

  function render(animate){
    clearTimers();
    heart.innerHTML = '';
    heart.classList.remove('beat');
    const {words, cx, cy, s} = layout();
    heart.style.transformOrigin = `${cx}px ${cy + 2.5*s}px`;
    glow.style.top = (cy + 2.5*s) + 'px';
    const frag = document.createDocumentFragment();
    const els = words.map(w => {
      const el = document.createElement('span');
      el.className = 'w' + (w.text === 'Seni seviyorum' ? ' tr' : '');
      el.textContent = w.text;
      el.style.cssText = `left:${w.x}px;top:${w.y}px;font-size:${w.size}px;line-height:${w.rowH}px;`;
      frag.appendChild(el);
      return el;
    });
    heart.appendChild(frag);

    const finish = () => {
      heart.classList.add('beat');
      glow.style.opacity = 1;
      glow.style.width = glow.style.height = (s*44) + 'px';
      msg.classList.add('on');
      replay.classList.add('on');
      built = true;
    };

    if (!animate){ els.forEach(e => e.classList.add('on')); finish(); return; }

    const order = els.slice().sort(() => Math.random() - 0.5);
    const total = 6500, step = total / order.length;
    order.forEach((el,i) => later(() => el.classList.add('on'), i*step + Math.random()*step*0.6));
    later(finish, total + 900);
  }

  function start(){
    built = false;
    clearTimers();
    heart.innerHTML = '';
    heart.classList.remove('beat');
    msg.classList.remove('on'); replay.classList.remove('on');
    glow.style.opacity = 0; glow.style.width = glow.style.height = '10px';
    later(() => intro.classList.add('on'), 300);
    later(() => intro.classList.remove('on'), 2600);
    later(() => render(true), 3900);
  }

  replay.addEventListener('click', start);

  let rt;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (built) render(false); }, 200);
  });

  // floating little hearts in the background
  const bg = document.getElementById('bg'), bctx = bg.getContext('2d');
  let parts = [];
  function sizeBg(){
    const d = Math.min(devicePixelRatio || 1, 2);
    bg.width = innerWidth*d; bg.height = innerHeight*d;
    bctx.setTransform(d,0,0,d,0,0);
  }
  sizeBg(); addEventListener('resize', sizeBg);
  function spawn(initial){
    return {x: Math.random()*innerWidth, y: initial ? Math.random()*innerHeight : innerHeight + 20,
            v: 0.15 + Math.random()*0.45, s: 6 + Math.random()*12, a: 0.05 + Math.random()*0.15,
            ph: Math.random()*Math.PI*2};
  }
  for (let i=0;i<28;i++) parts.push(spawn(true));
  (function tick(t){
    bctx.clearRect(0,0,innerWidth,innerHeight);
    for (const p of parts){
      p.y -= p.v;
      const x = p.x + Math.sin(t/1800 + p.ph)*14;
      bctx.font = `${p.s}px ${FONT}`;
      bctx.fillStyle = `rgba(255,45,70,${p.a})`;
      bctx.fillText('♥', x, p.y);
      if (p.y < -20) Object.assign(p, spawn(false));
    }
    requestAnimationFrame(tick);
  })(0);

  start();
})();
</script>
</body>
</html>
